asyncapi: 3.0.0
info:
  title: LedgerFlow Async Messaging API
  version: 1.0.0
  description: Event-driven architecture components for LedgerFlow using RabbitMQ.
servers:
  rabbitmq:
    host: localhost:5672
    protocol: amqp
channels:
  payment.commands.q:
    address: ledgerflow.payment.commands.q
    messages:
      paymentCommand:
        $ref: '#/components/messages/PaymentChargeRequested'
  webhook.commands.q:
    address: ledgerflow.webhooks.commands.q
    messages:
      webhookCommand:
        $ref: '#/components/messages/WebhookInboundRequested'
  inventory.events:
    address: ledgerflow.inventory.events
    messages:
      balanceChanged:
        $ref: '#/components/messages/InventoryBalanceChanged'
      reservationConsumed:
        $ref: '#/components/messages/InventoryReservationConsumed'
  orders.events:
    address: ledgerflow.orders.events
    messages:
      orderConfirmed:
        $ref: '#/components/messages/OrderConfirmed'
      orderCancelled:
        $ref: '#/components/messages/OrderCancelled'
      orderFulfilled:
        $ref: '#/components/messages/OrderFulfilled'
  channel.events:
    address: ledgerflow.channel.events
    messages:
      channelWebhookReceived:
        $ref: '#/components/messages/ChannelWebhookReceived'
      channelWebhookInvalid:
        $ref: '#/components/messages/ChannelWebhookInvalid'
      channelListingImportCompleted:
        $ref: '#/components/messages/ChannelListingImportCompleted'
      channelListingMapped:
        $ref: '#/components/messages/ChannelListingMapped'
      channelInventorySyncRequested:
        $ref: '#/components/messages/ChannelInventorySyncRequested'
      channelInventorySyncCompleted:
        $ref: '#/components/messages/ChannelInventorySyncCompleted'
  financial.events:
    address: ledgerflow.financial.events
    messages:
      orderFactCreated:
        $ref: '#/components/messages/FinancialOrderFactCreated'
  export.events:
    address: ledgerflow.export.events
    messages:
      exportJobCompleted:
        $ref: '#/components/messages/ExportJobCompleted'
      exportJobFailed:
        $ref: '#/components/messages/ExportJobFailed'
  reconciliation.events:
    address: ledgerflow.reconciliation.events
    messages:
      settlementReceived:
        $ref: '#/components/messages/ReconciliationSettlementReceived'
components:
  messages:
    PaymentChargeRequested:
      name: payment.provider_charge_creation_requested
      title: Provider Charge Creation Requested
      summary: Command to create a charge in an external provider.
      payload:
        type: object
        properties:
          messageId:
            type: string
          eventType:
            type: string
          aggregateId:
            type: string
          tenantId:
            type: string
    WebhookInboundRequested:
      name: webhook.inbound_processing_requested
      title: Webhook Inbound Processing Requested
      summary: Command to process an inbound webhook asynchronously.
      payload:
        type: object
        properties:
          messageId:
            type: string
          eventType:
            type: string
          aggregateId:
            type: string
    InventoryReservationConsumed:
      name: inventory.reservation.consumed
      title: Inventory Reservation Consumed
      summary: Event emitted when an active inventory reservation is fully consumed.
      payload:
        type: object
        required:
          - reservationId
          - skuId
          - warehouseId
          - quantity
          - movementId
        properties:
          reservationId:
            type: string
          skuId:
            type: string
          warehouseId:
            type: string
          quantity:
            type: number
            format: decimal
          movementId:
            type: string
    InventoryBalanceChanged:
      name: inventory.balance.changed
      title: Inventory Balance Changed
      summary: Event emitted when an inventory balance projection changes.
      payload:
        type: object
        required:
          - balanceId
          - skuId
          - warehouseId
          - availableQuantity
        properties:
          balanceId:
            type: string
          skuId:
            type: string
          warehouseId:
            type: string
          availableQuantity:
            type: number
            format: decimal
          onHandQuantity:
            type: number
            format: decimal
          reservedQuantity:
            type: number
            format: decimal
          version:
            type: integer
    OrderConfirmed:
      name: orders.order.confirmed
      title: Internal Order Confirmed
      summary: Event emitted when an internal order reserves stock and becomes confirmed.
      payload:
        $ref: '#/components/schemas/InternalOrderStatusChangedPayload'
    OrderCancelled:
      name: orders.order.cancelled
      title: Internal Order Cancelled
      summary: Event emitted when an internal order is cancelled and reservations are released.
      payload:
        $ref: '#/components/schemas/InternalOrderStatusChangedPayload'
    OrderFulfilled:
      name: orders.order.fulfilled
      title: Internal Order Fulfilled
      summary: Event emitted when an internal order consumes reservations and is fulfilled.
      payload:
        $ref: '#/components/schemas/InternalOrderStatusChangedPayload'
    ChannelWebhookReceived:
      name: channel.webhook.received
      title: Channel Webhook Received
      summary: Event emitted when a channel webhook is accepted into the sanitized inbox.
      payload:
        $ref: '#/components/schemas/ChannelWebhookInboxPayload'
    ChannelWebhookInvalid:
      name: channel.webhook.invalid
      title: Channel Webhook Invalid
      summary: Event emitted when a channel webhook payload is structurally invalid.
      payload:
        $ref: '#/components/schemas/ChannelWebhookInboxPayload'
    ChannelListingImportCompleted:
      name: channel.listing.import.completed
      title: Channel Listing Import Completed
      summary: Event emitted when mock channel listings are imported and classified.
      payload:
        $ref: '#/components/schemas/ChannelListingImportCompletedPayload'
    ChannelListingMapped:
      name: channel.listing.mapped
      title: Channel Listing Mapped
      summary: Event emitted when a channel listing is manually mapped to a ProductSku.
      payload:
        $ref: '#/components/schemas/ChannelListingMappedPayload'
    ChannelInventorySyncRequested:
      name: channel.inventory_sync.requested
      title: Channel Inventory Sync Requested
      summary: Event emitted when a mapped listing needs outbound inventory sync.
      payload:
        $ref: '#/components/schemas/ChannelInventorySyncPayload'
    ChannelInventorySyncCompleted:
      name: channel.inventory_sync.completed
      title: Channel Inventory Sync Completed
      summary: Event emitted when mock outbound inventory sync succeeds.
      payload:
        $ref: '#/components/schemas/ChannelInventorySyncPayload'
    FinancialOrderFactCreated:
      name: financial.order_fact.created
      title: Financial Order Fact Created
      summary: Event emitted when an operational financial fact is created for an order.
      payload:
        $ref: '#/components/schemas/FinancialOrderFactPayload'
    ExportJobCompleted:
      name: export.job.completed
      title: Export Job Completed
      summary: Event emitted when an export job is completed and ready for secure download.
      payload:
        $ref: '#/components/schemas/ExportJobCompletedPayload'
    ExportJobFailed:
      name: export.job.failed
      title: Export Job Failed
      summary: Event emitted when an export job fails during generation.
      payload:
        $ref: '#/components/schemas/ExportJobFailedPayload'
    ReconciliationSettlementReceived:
      name: reconciliation.settlement_received
      title: Reconciliation Settlement Received
      summary: Event emitted when a provider settlement fact is normalized for reconciliation.
      payload:
        $ref: '#/components/schemas/ReconciliationSettlementPayload'
  schemas:
    ReconciliationSettlementPayload:
      type: object
      required:
        - providerSettlementEventId
        - provider
        - providerEventId
      properties:
        providerSettlementEventId:
          type: string
        provider:
          type: string
          enum:
            - ASAAS
            - STRIPE
            - MERCADO_PAGO
            - PAGBANK
            - PAGARME
        providerEventId:
          type: string
        providerPaymentId:
          type: string
          nullable: true
        externalReference:
          type: string
          nullable: true
    InternalOrderStatusChangedPayload:
      type: object
      required:
        - orderId
        - status
      properties:
        orderId:
          type: string
        status:
          type: string
          enum:
            - CONFIRMED
            - CANCELLED
            - FULFILLED
    ChannelWebhookInboxPayload:
      type: object
      required:
        - inboxEventId
        - provider
        - providerEventId
        - status
      properties:
        inboxEventId:
          type: string
        provider:
          type: string
          enum:
            - MOCK
            - MERCADO_LIVRE
        providerEventId:
          type: string
        status:
          type: string
          enum:
            - RECEIVED
            - DUPLICATE
            - INVALID
            - DLQ
    ChannelListingImportCompletedPayload:
      type: object
      required:
        - integrationId
        - provider
        - summary
      properties:
        integrationId:
          type: string
        provider:
          type: string
          enum:
            - MOCK
            - MERCADO_LIVRE
        summary:
          type: object
          required:
            - imported
            - matched
            - unmatched
            - ambiguous
            - ignored
          properties:
            imported:
              type: integer
            matched:
              type: integer
            unmatched:
              type: integer
            ambiguous:
              type: integer
            ignored:
              type: integer
    ChannelListingMappedPayload:
      type: object
      required:
        - listingId
        - skuId
      properties:
        listingId:
          type: string
        skuId:
          type: string
    ChannelInventorySyncPayload:
      type: object
      required:
        - listingId
        - skuId
        - provider
        - targetAvailableQuantity
      properties:
        listingId:
          type: string
        skuId:
          type: string
        balanceId:
          type: string
        provider:
          type: string
          enum:
            - MOCK
            - MERCADO_LIVRE
        targetAvailableQuantity:
          type: number
          format: decimal
    FinancialOrderFactPayload:
      type: object
      required:
        - factId
        - orderId
        - revenueAmount
        - cogsAmount
        - grossMarginAmount
      properties:
        factId:
          type: string
        orderId:
          type: string
        revenueAmount:
          type: string
        cogsAmount:
          type: string
        grossMarginAmount:
          type: string
    ExportJobCompletedPayload:
      type: object
      required:
        - exportJobId
        - type
        - format
        - rowCount
      properties:
        exportJobId:
          type: string
        type:
          type: string
          enum:
            - ORDER_FINANCIAL_FACTS
            - CATALOG_PRODUCTS
        format:
          type: string
          enum:
            - CSV
            - XLSX
        rowCount:
          type: integer
        expiresAt:
          type: string
          format: date-time
    ExportJobFailedPayload:
      type: object
      required:
        - exportJobId
        - type
        - format
        - errorCode
      properties:
        exportJobId:
          type: string
        type:
          type: string
          enum:
            - ORDER_FINANCIAL_FACTS
            - CATALOG_PRODUCTS
        format:
          type: string
          enum:
            - CSV
            - XLSX
        errorCode:
          type: string
        errorSummary:
          type: string
